<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 140" width="460" height="120" role="img" aria-label="Semvibe">
  <defs>
    <linearGradient id="cyan-blue-light" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <linearGradient id="box-border-light" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
  </defs>

  <!-- Architectural Icon Badge -->
  <g transform="translate(25, 20)">
    <rect x="0" y="0" width="100" height="100" rx="26" fill="#f8fafc" stroke="url(#box-border-light)" stroke-width="2.5" />
    <path d="M50 24 L76 76 L24 76 Z" fill="none" stroke="url(#cyan-blue-light)" stroke-width="7" stroke-linejoin="round" stroke-linecap="round" />
    <path d="M34 64 Q50 49 66 64" fill="none" stroke="#0284c7" stroke-width="4" stroke-linecap="round" />
    <circle cx="50" cy="52" r="8" fill="#0f172a" />
    <circle cx="50" cy="52" r="4.5" fill="#38bdf8" />
  </g>

  <!-- Typography -->
  <text x="150" y="90" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="68" font-weight="900" letter-spacing="-1.5">
    <tspan fill="#0f172a">sem</tspan><tspan fill="url(#cyan-blue-light)">vibe</tspan>
  </text>
</svg>
