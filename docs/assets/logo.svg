<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 160" width="450" height="120" role="img" aria-label="Semvibe">
  <defs>
    <linearGradient id="grad-icon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
  </defs>
  <!-- Architectural Icon -->
  <g transform="translate(40, 30)">
