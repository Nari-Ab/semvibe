<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 140" width="460" height="120" role="img" aria-label="Semvibe">
  <defs>
    <!-- Gradient for vibe text and icon stroke -->
    <linearGradient id="cyan-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>

    <!-- Border gradient for the icon container -->
    <linearGradient id="box-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#60a5fa" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>

    <!-- Subtle container surface gradient (slate 800 -> 900 for solid contrast on #0d1117) -->
    <linearGradient id="box-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Subtle drop shadow / outer glow -->
    <filter id="neon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="5" flood-color="#38bdf8" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Architectural Icon Badge -->
  <g transform="translate(25, 20)">
    <!-- Container background with distinct slate fill and vibrant gradient border -->
    <rect x="0" y="0" width="100" height="100" rx="26" fill="url(#box-bg)" stroke="url(#box-border)" stroke-width="2.5" filter="url(#neon-glow)" />

    <!-- Geometry: Delta compass & horizon -->
    <!-- Triangle -->
    <path d="M50 24 L76 76 L24 76 Z" fill="none" stroke="url(#cyan-glow)" stroke-width="7" stroke-linejoin="round" stroke-linecap="round" />
    <!-- Horizon bridge -->
    <path d="M34 64 Q50 49 66 64" fill="none" stroke="#60a5fa" stroke-width="4" stroke-linecap="round" />
    <!-- Core central node (bright white core with cyan ring) -->
    <circle cx="50" cy="52" r="8" fill="#ffffff" />
    <circle cx="50" cy="52" r="4.5" fill="#38bdf8" />
  </g>

  <!-- Typography: Bright white #ffffff for "sem", vibrant electric cyan for "vibe" -->
  <text x="150" y="90" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="68" font-weight="900" letter-spacing="-1.5">
    <tspan fill="#ffffff">sem</tspan><tspan fill="url(#cyan-glow)">vibe</tspan>
  </text>
</svg>
